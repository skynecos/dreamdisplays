name: One-shot full personal subtitle restoration

on:
  push:
    branches:
      - fix/full-personal-subtitle-style-stable

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Apply guarded patch
        run: python3 .github/scripts/apply_full_personal_subtitle_style.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Compile common and both loaders on active 1.21.11
        run: |
          chmod +x ./gradlew
          echo "1.21.11" > versions/active.txt
          ./gradlew \
            :api:compileKotlin \
            :platform:client:common:compileKotlin \
            :platform:client:fabric:compileKotlin \
            :platform:client:neoforge:compileKotlin \
            --no-daemon

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api platform
          git commit -m "fix: restore full personal subtitle appearance controls"
          git push origin HEAD:fix/full-personal-subtitle-style-stable
