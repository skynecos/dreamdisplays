name: Build exact runtime overlay

on:
  push:
    branches:
      - testoptimize
    paths:
      - ".github/workflows/publish-stallfix-transport.yml"

permissions:
  contents: write

jobs:
  overlay:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout verified stallfix build
        uses: actions/checkout@v4
        with:
          ref: testoptimize-build
          path: verified

      - name: Build and verify runtime-identical overlay against public Android9 base
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/android9-base.jar"
          TARGET="$GITHUB_WORKSPACE/verified/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar"
          BASE_URL='https://raw.githubusercontent.com/skynecos/KiraziumLauncher/dreamdisplays-android9-build/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android9.jar'
          curl --fail --location --retry 3 --silent --show-error "$BASE_URL" -o "$BASE"
          test "$(stat -c '%s' "$BASE")" = '23437862'
          test "$(sha256sum "$BASE" | awk '{print $1}')" = '9525319933e1fb629cd151b37326e7dbba88286a1db3d742dba7277d4070f935'
          test "$(stat -c '%s' "$TARGET")" = '23595235'
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = '918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1'

          python3 - "$BASE" "$TARGET" "$RUNNER_TEMP" <<'PY'
          import hashlib, io, json, pathlib, shutil, sys, zipfile
          base_p, target_p, out_p = map(pathlib.Path, sys.argv[1:])
          root = out_p / 'overlay-work'
          shutil.rmtree(root, ignore_errors=True)
          overlay_dir = root / 'overlay'
          rebuilt_dir = root / 'rebuilt'
          overlay_dir.mkdir(parents=True)
          rebuilt_dir.mkdir(parents=True)

          def entries(path):
              with zipfile.ZipFile(path) as z:
                  result = {}
                  for info in z.infolist():
                      if info.is_dir():
                          continue
                      data = z.read(info.filename)
                      result[info.filename] = hashlib.sha256(data).hexdigest()
                  return result

          b = entries(base_p); t = entries(target_p)
          changed = sorted(k for k,v in t.items() if b.get(k) != v)
          deleted = sorted(k for k in b if k not in t)
          with zipfile.ZipFile(target_p) as zt, zipfile.ZipFile(root/'overlay.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as zo:
              for name in changed:
                  zo.writestr(name, zt.read(name))
          (root/'delete.txt').write_text('\n'.join(deleted) + ('\n' if deleted else ''), encoding='utf-8')

          with zipfile.ZipFile(base_p) as zb:
              zb.extractall(rebuilt_dir)
          for name in deleted:
              p = rebuilt_dir/name
              if p.exists(): p.unlink()
          with zipfile.ZipFile(root/'overlay.zip') as zo:
              zo.extractall(rebuilt_dir)
          rebuilt = root/'rebuilt.jar'
          with zipfile.ZipFile(rebuilt,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as zr:
              for p in sorted(x for x in rebuilt_dir.rglob('*') if x.is_file()):
                  zr.write(p, p.relative_to(rebuilt_dir).as_posix())

          r = entries(rebuilt)
          assert r == t, f'Runtime entry mismatch: rebuilt={len(r)} target={len(t)}'
          metrics = {
              'base_url':'https://raw.githubusercontent.com/skynecos/KiraziumLauncher/dreamdisplays-android9-build/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android9.jar',
              'base_sha256':'9525319933e1fb629cd151b37326e7dbba88286a1db3d742dba7277d4070f935',
              'base_size':23437862,
              'tested_target_sha256':'918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1',
              'tested_target_size':23595235,
              'changed_entries':len(changed),
              'deleted_entries':len(deleted),
              'overlay_size':(root/'overlay.zip').stat().st_size,
              'rebuilt_sha256':hashlib.sha256(rebuilt.read_bytes()).hexdigest(),
              'rebuilt_size':rebuilt.stat().st_size,
          }
          (root/'META.json').write_text(json.dumps(metrics,indent=2)+'\n', encoding='utf-8')
          print(json.dumps(metrics, indent=2))
          PY

          mkdir -p "$RUNNER_TEMP/overlay-transfer"
          cp "$RUNNER_TEMP/overlay-work/META.json" "$RUNNER_TEMP/overlay-transfer/"
          cp "$RUNNER_TEMP/overlay-work/delete.txt" "$RUNNER_TEMP/overlay-transfer/"
          base64 -w 0 "$RUNNER_TEMP/overlay-work/overlay.zip" | split -b 6000 -d -a 3 - "$RUNNER_TEMP/overlay-transfer/overlay.zip.b64.part-"
          printf 'parts=%s\n' "$(find "$RUNNER_TEMP/overlay-transfer" -name 'overlay.zip.b64.part-*' | wc -l)" >> "$RUNNER_TEMP/overlay-transfer/PARTS.txt"

      - name: Publish verified overlay branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/verified"
          git switch --orphan testoptimize-overlay-build
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p artifacts
          cp "$RUNNER_TEMP/overlay-transfer"/* artifacts/
          git add artifacts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build: runtime-identical stallfix1 overlay'
          git push --force origin HEAD:refs/heads/testoptimize-overlay-build
