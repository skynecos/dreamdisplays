name: Publish verified stallfix transport

on:
  push:
    branches:
      - testoptimize
    paths:
      - ".github/workflows/publish-stallfix-transport.yml"

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout private verified build branch
        uses: actions/checkout@v4
        with:
          ref: testoptimize-build
          path: verified

      - name: Verify exact stallfix JAR
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/verified/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar"
          test -s "$JAR"
          test "$(stat -c '%s' "$JAR")" = "23595235"
          test "$(sha256sum "$JAR" | awk '{print $1}')" = "918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1"

      - name: Upload verified JAR to transport endpoint
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/verified/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar"
          URL="$(curl --fail --silent --show-error --location \
            -F 'reqtype=fileupload' \
            -F "fileToUpload=@${JAR};type=application/java-archive" \
            https://catbox.moe/user/api.php)"
          case "$URL" in
            https://files.catbox.moe/*) ;;
            *) echo "::error::Unexpected transport response: $URL"; exit 1 ;;
          esac
          echo "TRANSPORT_URL=$URL"
          curl --fail --silent --show-error --location "$URL" -o "$RUNNER_TEMP/roundtrip.jar"
          test "$(stat -c '%s' "$RUNNER_TEMP/roundtrip.jar")" = "23595235"
          test "$(sha256sum "$RUNNER_TEMP/roundtrip.jar" | awk '{print $1}')" = "918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1"
          echo "TRANSPORT_VERIFIED=1"
