name: Build exact stallfix delta

on:
  push:
    branches:
      - testoptimize
    paths:
      - ".github/workflows/publish-stallfix-transport.yml"

permissions:
  contents: write

jobs:
  delta:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout private verified build branch
        uses: actions/checkout@v4
        with:
          ref: testoptimize-build
          path: verified

      - name: Verify exact stallfix JAR
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/verified/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar"
          test -s "$JAR"
          test "$(stat -c '%s' "$JAR")" = "23595235"
          test "$(sha256sum "$JAR" | awk '{print $1}')" = "918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1"

      - name: Build and verify exact delta against public Android9 base
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bsdiff
          BASE="$RUNNER_TEMP/android9-base.jar"
          TARGET="$GITHUB_WORKSPACE/verified/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar"
          BASE_URL='https://raw.githubusercontent.com/skynecos/KiraziumLauncher/dreamdisplays-android9-build/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android9.jar'
          curl --fail --location --retry 3 --silent --show-error "$BASE_URL" -o "$BASE"
          test -s "$BASE"
          jar tf "$BASE" >/dev/null
          test "$(stat -c '%s' "$BASE")" = '23437862'
          test "$(sha256sum "$BASE" | awk '{print $1}')" = '9525319933e1fb629cd151b37326e7dbba88286a1db3d742dba7277d4070f935'

          bsdiff "$BASE" "$TARGET" "$RUNNER_TEMP/stallfix1.bsdiff"
          bspatch "$BASE" "$RUNNER_TEMP/reconstructed.jar" "$RUNNER_TEMP/stallfix1.bsdiff"
          test "$(stat -c '%s' "$RUNNER_TEMP/reconstructed.jar")" = '23595235'
          test "$(sha256sum "$RUNNER_TEMP/reconstructed.jar" | awk '{print $1}')" = '918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1'

          PATCH_SIZE="$(stat -c '%s' "$RUNNER_TEMP/stallfix1.bsdiff")"
          echo "PATCH_SIZE=$PATCH_SIZE"
          rm -rf "$RUNNER_TEMP/delta-transfer"
          mkdir -p "$RUNNER_TEMP/delta-transfer"
          base64 -w 0 "$RUNNER_TEMP/stallfix1.bsdiff" | split -b 30000 -d -a 3 - "$RUNNER_TEMP/delta-transfer/stallfix1.patch.b64.part-"
          PARTS="$(find "$RUNNER_TEMP/delta-transfer" -name 'stallfix1.patch.b64.part-*' | wc -l)"
          printf 'method=bsdiff\nbase_url=%s\nbase_sha256=%s\nbase_size=%s\ntarget_sha256=%s\ntarget_size=%s\npatch_size=%s\nparts=%s\n' \
            "$BASE_URL" \
            '9525319933e1fb629cd151b37326e7dbba88286a1db3d742dba7277d4070f935' \
            '23437862' \
            '918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1' \
            '23595235' "$PATCH_SIZE" "$PARTS" > "$RUNNER_TEMP/delta-transfer/META.txt"

      - name: Publish verified delta transfer branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/verified"
          git switch --orphan testoptimize-delta-build
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p artifacts
          cp "$RUNNER_TEMP/delta-transfer"/* artifacts/
          git add artifacts
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build: exact stallfix1 delta from public android9 base'
          git push --force origin HEAD:refs/heads/testoptimize-delta-build
