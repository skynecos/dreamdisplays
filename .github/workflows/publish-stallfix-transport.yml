name: Transfer stallfix to launcher

on:
  push:
    branches:
      - testoptimize
    paths:
      - ".github/workflows/publish-stallfix-transport.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout private verified build branch
        uses: actions/checkout@v4
        with:
          ref: testoptimize-build
          path: verified

      - name: Verify exact stallfix JAR
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/verified/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar"
          test -s "$JAR"
          test "$(stat -c '%s' "$JAR")" = "23595235"
          test "$(sha256sum "$JAR" | awk '{print $1}')" = "918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1"

      - name: Copy verified JAR into launcher source and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/verified/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar"
          TARGET="app_pojavlauncher/src/main/assets/kirazium/mods/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar"
          git clone --depth 1 --branch codex/embedded-ffmpeg-single-apk \
            https://github.com/skynecos/KiraziumLauncher.git "$GITHUB_WORKSPACE/launcher"
          cd "$GITHUB_WORKSPACE/launcher"
          mkdir -p "$(dirname "$TARGET")"
          cp "$JAR" "$TARGET"
          test "$(stat -c '%s' "$TARGET")" = "23595235"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1"
          git add "$TARGET"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build: embed verified DreamDisplays stallfix1'
          git push "https://x-access-token:${GH_TOKEN}@github.com/skynecos/KiraziumLauncher.git" \
            HEAD:refs/heads/codex/embedded-ffmpeg-single-apk
