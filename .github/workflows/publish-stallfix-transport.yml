name: Publish stallfix transport

on:
  push:
    branches:
      - testoptimize
    paths:
      - ".github/workflows/publish-stallfix-transport.yml"

permissions:
  contents: write

# One-shot transport for the exact phone-tested Kirazium stallfix binary.
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout private verified build branch
        uses: actions/checkout@v4
        with:
          ref: testoptimize-build
          path: verified

      - name: Verify exact stallfix JAR
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/verified/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar"
          test -s "$JAR"
          test "$(stat -c '%s' "$JAR")" = "23595235"
          test "$(sha256sum "$JAR" | awk '{print $1}')" = "918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1"

      - name: Publish unlisted Modrinth transport version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MODRINTH_TOKEN:-}"
          JAR="$GITHUB_WORKSPACE/verified/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar"
          VERSION_NUMBER="1.9.5-kirazium-android-stallfix1-transport-${GITHUB_SHA::8}"
          DATA=$(python3 - "$VERSION_NUMBER" <<'PY'
          import json, sys
          print(json.dumps({
              "name": "Kirazium Android Stallfix1 Transport",
              "version_number": sys.argv[1],
              "version_type": "alpha",
              "loaders": ["fabric"],
              "featured": False,
              "status": "unlisted",
              "project_id": "dreamdisplays",
              "file_parts": ["file"],
              "primary_file": "file",
              "game_versions": ["26.1.2"],
              "environment": "client_and_server",
              "changelog": "Kirazium launcher verified binary transport."
          }))
          PY
          )
          http=$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/modrinth-response.json" \
            --write-out '%{http_code}' \
            -X POST 'https://api.modrinth.com/v2/version' \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H 'User-Agent: KiraziumLauncher/1.0 (github.com/skynecos/KiraziumLauncher)' \
            -F "data=$DATA" \
            -F "file=@$JAR;type=application/java-archive")
          cat "$RUNNER_TEMP/modrinth-response.json"
          test "$http" = "200"
          python3 - "$RUNNER_TEMP/modrinth-response.json" "$RUNNER_TEMP/transport.txt" <<'PY'
          import json, pathlib, sys
          obj=json.load(open(sys.argv[1], encoding='utf-8'))
          files=obj.get('files') or []
          assert files and files[0].get('url')
          url=files[0]['url']
          vid=obj['id']
          pathlib.Path(sys.argv[2]).write_text(f"version_id={vid}\nurl={url}\nsha256=918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1\nsize=23595235\n", encoding='utf-8')
          PY

      - name: Save transport metadata to verified build branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/verified"
          cp "$RUNNER_TEMP/transport.txt" artifacts/MODRINTH_TRANSPORT.txt
          git add artifacts/MODRINTH_TRANSPORT.txt
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build: publish verified stallfix transport metadata'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:testoptimize-build
