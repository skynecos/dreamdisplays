name: Temporary subtitle clean render patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: harden subtitle clean render patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove conflicting font layers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platform/client/common/src/main/kotlin/com/dreamdisplays/platform/client/render/ScreenRenderer.kt')
          lines = p.read_text().splitlines()
          changes = 0
          for i in range(len(lines)):
              if lines[i].strip() != 'true,':
                  continue
              end = min(len(lines), i + 7)
              window = [lines[j].strip() for j in range(i + 1, end)]
              if 'Font.DisplayMode.NORMAL,' not in window or '0x80000000.toInt(),' not in window:
                  continue
              indent = lines[i][:-len(lines[i].lstrip())]
              lines[i] = indent + 'false,'
              for j in range(i + 1, end):
                  if lines[j].strip() == '0x80000000.toInt(),':
                      bg_indent = lines[j][:-len(lines[j].lstrip())]
                      lines[j] = bg_indent + '0,'
                      break
              changes += 1
          if changes != 2:
              raise SystemExit(f'expected 2 subtitle font blocks, changed {changes}')
          p.write_text('\n'.join(lines) + '\n')
          PY
          rm .github/workflows/zz-subtitle-clean-render.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Kirazium CI'
          git config user.email 'actions@users.noreply.github.com'
          git add platform/client/common/src/main/kotlin/com/dreamdisplays/platform/client/render/ScreenRenderer.kt .github/workflows/zz-subtitle-clean-render.yml
          git commit -m 'fix: render subtitles as a clean single layer'
          git push origin HEAD:main
