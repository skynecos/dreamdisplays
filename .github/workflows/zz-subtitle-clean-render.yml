name: Temporary subtitle clean render patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: fix subtitle clean render patch workflow' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove conflicting font layers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platform/client/common/src/main/kotlin/com/dreamdisplays/platform/client/render/ScreenRenderer.kt')
          lines = p.read_text().splitlines()
          changes = 0
          for i in range(len(lines) - 4):
              if (lines[i].strip() == '-1,'
                      and lines[i + 1].strip() == 'true,'
                      and lines[i + 2].strip() == 'Font.DisplayMode.NORMAL,'
                      and lines[i + 3].strip() == '0x80000000.toInt(),'
                      and lines[i + 4].strip() == '0xF000F0,'):
                  indent = lines[i + 1][:-len(lines[i + 1].lstrip())]
                  lines[i + 1] = indent + 'false,'
                  lines[i + 3] = indent + '0,'
                  changes += 1
          if changes != 2:
              raise SystemExit(f'expected 2 subtitle font blocks, changed {changes}')
          p.write_text('\n'.join(lines) + '\n')
          PY
          rm .github/workflows/zz-subtitle-clean-render.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Kirazium CI'
          git config user.email 'actions@users.noreply.github.com'
          git add platform/client/common/src/main/kotlin/com/dreamdisplays/platform/client/render/ScreenRenderer.kt .github/workflows/zz-subtitle-clean-render.yml
          git commit -m 'fix: render subtitles as a clean single layer'
          git push origin HEAD:main
