name: Temporary upstream 1.9.6 source sync

on:
  push:
    branches: [sync-upstream-1.9.6]

permissions:
  contents: write

jobs:
  sync:
    if: "${{ github.event.head_commit.message == 'chore: stage upstream 1.9.6 source sync' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-upstream-1.9.6
          fetch-depth: 0
      - name: Apply source delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kirazium CI'
          git config user.email 'actions@users.noreply.github.com'
          git remote add upstream https://github.com/arnodoelinger/dreamdisplays.git
          git fetch upstream --tags --force
          BASE=$(git rev-parse 'refs/tags/v1.9.5^{commit}')
          TARGET=$(git rev-parse 'refs/tags/v1.9.6^{commit}')
          git diff --binary --full-index "$BASE" "$TARGET" > /tmp/upstream.patch
          set +e
          git apply --3way --index /tmp/upstream.patch
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            ACTUAL=$(git diff --name-only --diff-filter=U | sort | tr '\n' '|')
            EXPECTED=$(printf '%s\n' 'CHANGELOG.md' 'gradle.properties' 'platform/client/common/src/main/kotlin/com/dreamdisplays/platform/client/displays/DisplayScreen.kt' | sort | tr '\n' '|')
            if [ "$ACTUAL" != "$EXPECTED" ]; then echo "Unexpected conflicts: $ACTUAL"; exit 2; fi
          fi
          git show "$TARGET:CHANGELOG.md" > CHANGELOG.md
          git show HEAD:gradle.properties > gradle.properties
          SCREEN='platform/client/common/src/main/kotlin/com/dreamdisplays/platform/client/displays/DisplayScreen.kt'
          git show HEAD:"$SCREEN" > "$SCREEN"
          echo '' | base64 -d > /tmp/resolve.py
          python3 /tmp/resolve.py
          git show HEAD:.github/workflows/_build.yml > .github/workflows/_build.yml
          git show HEAD:.github/workflows/release.yml > .github/workflows/release.yml
          git add CHANGELOG.md gradle.properties "$SCREEN" .github/workflows/_build.yml .github/workflows/release.yml
          if git diff --name-only --diff-filter=U | grep -q .; then git diff --name-only --diff-filter=U; exit 3; fi
          git add -A
          git commit -m 'feat: sync DreamDisplays 1.9.6 source while preserving Kirazium VTT'
          git push origin HEAD:sync-upstream-1.9.6
