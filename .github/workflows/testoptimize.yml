name: testoptimize

on:
  push:
    branches:
      - testoptimize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-testoptimize:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout testoptimize source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and verify testoptimize Android software candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/build-testoptimize.sh

      - name: Upload verified stallfix JAR
        uses: actions/upload-artifact@v4
        with:
          name: dreamdisplays-android-stallfix1
          path: ${{ runner.temp }}/testoptimize-output/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
