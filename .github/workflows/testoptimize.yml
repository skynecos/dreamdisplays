name: testoptimize

on:
  push:
    branches:
      - testoptimize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-testoptimize:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout testoptimize source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and verify testoptimize Android software candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/build-testoptimize.sh
