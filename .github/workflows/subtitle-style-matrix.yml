name: Subtitle style cross-version compile

on:
  push:
    branches:
      - fix/full-personal-subtitle-style-stable

jobs:
  compile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.1", "1.21.11", "26.1.2", "26.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Select Minecraft version
        run: echo "${{ matrix.mc }}" > versions/active.txt

      - name: Compile API, common, Fabric and NeoForge
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :api:compileKotlin \
            :platform:client:common:compileKotlin \
            :platform:client:fabric:compileKotlin \
            :platform:client:neoforge:compileKotlin \
            --no-daemon
