name: Kirazium Android Software Decode Stable

on:
  push:
    branches:
      - codex/android-software-decode-stable
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fabric-26-1-2:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and verify explicit software-decode candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/build-android-software-decode.sh
