name: Upload Android Software JAR

on:
  push:
    branches:
      - codex/android-software-decode-stable
    paths:
      - ".github/workflows/upload-software-jar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch verified software JAR
        run: |
          set -euo pipefail
          git fetch --depth 1 origin android-software-decode-build
          mkdir -p out
          git show FETCH_HEAD:artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-software.jar > out/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-software.jar
          test -s out/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-software.jar
          echo '6deb5555a9df472e99da25782985b8a5637b43889a4980b1ec26ce63325b491b  out/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-software.jar' | sha256sum -c -

      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: dreamdisplays-android-software
          path: out/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-software.jar
          if-no-files-found: error
          compression-level: 0
