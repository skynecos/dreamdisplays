name: Android Java launcher quota-safe build

on:
  push:
    branches:
      - fix/android-java-launcher-support
  workflow_dispatch:

concurrency:
  group: android-java-launcher-quota-safe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish Android Java launcher jars without Actions artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Android compatibility branch
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.1.0

      - name: Setup JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run core tests
        run: |
          set -euo pipefail
          printf '%s' '1.21.11' > versions/active.txt
          ./gradlew :core:test --no-daemon

      - name: Build all configured Fabric versions
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4G
        run: |
          set -euo pipefail
          rm -rf quota-safe-release
          mkdir -p quota-safe-release

          build_with_retry() {
            local mc="$1"
            local attempt
            for attempt in 1 2 3 4; do
              echo "Building Fabric ${mc} (attempt ${attempt}/4)"
              if [[ "$attempt" -eq 1 ]]; then
                if ./gradlew :platform:client:fabric:publishJar --no-daemon --parallel --stacktrace; then
                  return 0
                fi
              else
                if ./gradlew :platform:client:fabric:publishJar --no-daemon --parallel --stacktrace --refresh-dependencies; then
                  return 0
                fi
              fi
              if [[ "$attempt" -lt 4 ]]; then
                sleep $((attempt * 15))
              fi
            done
            echo "Fabric ${mc} still failed after 4 attempts." >&2
            return 1
          }

          for mc in 1.21.1 1.21.11 26.1.2 26.2; do
            test -d "versions/$mc"
            printf '%s' "$mc" > versions/active.txt
            build_with_retry "$mc"
          done

          find build/libs -maxdepth 1 -type f -name 'dreamdisplays-fabric-*.jar' -print -exec cp {} quota-safe-release/ \;
          test -n "$(find quota-safe-release -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Verify jars
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          jars = sorted(Path('quota-safe-release').glob('*.jar'))
          if len(jars) < 4:
              raise SystemExit(f'Expected at least 4 Fabric jars, found {len(jars)}')

          expected_versions = ('1.21.1', '1.21.11', '26.1.2', '26.2')
          names = [jar.name for jar in jars]
          for version in expected_versions:
              if not any(f'-{version}-' in name for name in names):
                  raise SystemExit(f'Missing Fabric build for {version}: {names}')

          for jar in jars:
              if jar.stat().st_size == 0:
                  raise SystemExit(f'Empty jar: {jar}')
              with ZipFile(jar) as zf:
                  if 'fabric.mod.json' not in set(zf.namelist()):
                      raise SystemExit(f'Not a Fabric mod jar: {jar}')

          with open('quota-safe-release/SHA256SUMS.txt', 'w', encoding='utf-8') as out:
              for jar in jars:
                  out.write(f"{hashlib.sha256(jar.read_bytes()).hexdigest()}  {jar.name}\n")
          PY

      - name: Publish verified jars to quota-safe branch
        run: |
          set -euo pipefail
          staged="${RUNNER_TEMP}/android-java-launcher-jars"
          output="${RUNNER_TEMP}/android-java-launcher-output"
          mkdir -p "$staged"
          cp quota-safe-release/* "$staged/"

          git worktree add --detach "$output" "$GITHUB_SHA"
          cd "$output"
          git switch --orphan android-java-launcher-build
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p artifacts
          cp "$staged"/* artifacts/
          printf 'source_commit=%s\nworkflow=quota-safe\nversions=1.21.1,1.21.11,26.1.2,26.2\n' "$GITHUB_SHA" > artifacts/BUILD_INFO.txt
          git add artifacts
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "build(android): verified Java launcher jars"
          git push --force origin HEAD:refs/heads/android-java-launcher-build
