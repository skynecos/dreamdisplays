name: test1

on:
  push:
    branches:
      - test1
    paths:
      - '.github/workflows/test1.yml'
      - '.github/scripts/build-test1.sh'
      - '.github/scripts/apply-test1-syncgate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test1-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout isolated test1 source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and verify TEST1 sync-gate JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/build-test1.sh
